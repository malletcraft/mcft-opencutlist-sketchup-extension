# MCFT branch checks. Upstream OpenCutList ships no Ruby CI; this is ours and
# is deliberately small — the plugin has no test bench, so the one thing worth
# automating is the failure that takes the WHOLE extension down: a file that
# SketchUp's Ruby cannot parse.
name: MCFT checks

on:
  push:
    branches: [mcft]
  pull_request:
    branches: [mcft]

jobs:
  ruby:
    name: Ruby parses, and parses on SketchUp 2017
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Any modern Ruby. The floor check is a SOURCE check, not an
          # execution one — see tools/check-ruby-floor.rb for why running under
          # the floor Ruby is neither available nor sufficient.
          ruby-version: '3.3'

      # Catches ordinary syntax errors. Cannot catch version-specific syntax,
      # which is the entire reason the next step exists.
      - name: ruby -c every file we own
        run: |
          set -e
          n=0
          while IFS= read -r f; do
            ruby -c "$f" > /dev/null
            n=$((n+1))
          done < <(find src/ladb_opencutlist/ruby -name '*.rb' -not -path '*/ruby/lib/*')
          echo "ruby -c: $n files OK"

      - name: No syntax newer than the Ruby floor (SketchUp 2021 / Ruby 2.7)
        run: ruby tools/check-ruby-floor.rb

      # Neither check above can see a require pointing at a file the COMMIT
      # does not carry: both walk files that exist on disk, and the missing
      # file existed on disk — it was only absent from git. 2026-08-24 shipped
      # exactly that and every install raised LoadError, taking down the whole
      # of OpenCutList rather than just the MCFT tab.
      - name: Every require_relative points at a file git actually has
        run: ruby tools/check-requires.rb

      # `node --check` parses; it cannot know that dialog.stopProgress was
      # never written. On 2026-09-03 a batch feature shipped calling two
      # invented methods and the only thing that found them was Amit clicking
      # the button and getting a red TypeError. The dialog API is a small
      # closed set, so checking every call against it is cheap and exact —
      # this fork's substitute for the unit tests it does not have.
      - name: Every dialog.<method>() call names a method that exists
        run: ruby tools/check-dialog-api.rb

  smoke:
    name: The dialog actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # THE ONLY CHECK HERE THAT RUNS THE CODE. Everything else in this
      # workflow reads it: ruby -c parses, check-dialog-api.rb matches names,
      # the templates job rebuilds a bundle. None of them can see a method that
      # exists but is called wrongly, or a template that resolves but throws
      # while rendering.
      #
      # It loads the real tab JS and the real compiled templates into jsdom,
      # stubs only the SketchUp bridge, and clicks through the MCFT actions.
      # Proved by reintroducing the TypeError of 2026-09-03: 4 checks fail and
      # it exits 1. A test that has only ever passed proves nothing.
      - name: Headless dialog smoke test
        run: |
          cd build
          npm install --no-audit --no-fund --silent
          cd ..
          NODE_PATH=build/node_modules node test/smoke/dialog-smoke.js

  templates:
    name: Committed twig bundle matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # js/templates/tabs-twig-templates.js is a BUILD OUTPUT that this branch
      # tracks on purpose (see .gitignore for why git is the only delivery
      # route). Tracking a generated file invites exactly one bug: someone
      # edits a .twig, forgets to run gulp, and ships a bundle that does not
      # contain the change — the plugin then looks stale for no visible
      # reason, which is the failure this repo has already paid for once.
      #
      # Compared SORTED, and that is not a way of being lenient. The bundle is
      # built by `gulp.src('twig/tabs/**') | concat`, and a glob's order comes
      # from the filesystem — so the same twig compiled on two machines yields
      # the same 99 templates concatenated in a different order. The first
      # version of this check diffed the bytes and failed on exactly that: 16
      # insertions, 16 deletions, every one of them a line that had simply
      # moved. A check that cannot pass gets deleted, and would have taken the
      # real guarantee with it.
      #
      # Sorting is sound here because each line is one independent
      # Twig.twig({id: "..."}) registration keyed by its id, so order carries
      # no meaning. Content still has to match exactly: edit a .twig without
      # recompiling and a line's text changes, which no amount of reordering
      # can hide.
      - name: Recompile and compare
        run: |
          f=src/ladb_opencutlist/js/templates/tabs-twig-templates.js
          sort "$f" > /tmp/committed.txt
          cd build
          npm install --no-audit --no-fund --silent
          npx gulp compile
          cd ..
          sort "$f" > /tmp/rebuilt.txt
          if ! diff -q /tmp/committed.txt /tmp/rebuilt.txt > /dev/null; then
            echo "::error::$f is stale — run 'cd build && npx gulp compile' and commit the result"
            diff /tmp/committed.txt /tmp/rebuilt.txt | head -20
            exit 1
          fi
          echo "committed bundle matches the twig it came from ($(grep -c '^Twig.twig({' "$f") templates)"
