# MCFT branch checks. Upstream OpenCutList ships no Ruby CI; this is ours and
# is deliberately small — the plugin has no test bench, so the one thing worth
# automating is the failure that takes the WHOLE extension down: a file that
# SketchUp's Ruby cannot parse.
name: MCFT checks

on:
  push:
    # mcft8 is where the move onto OpenCutList 8 is built: red there is free,
    # because the Mac fetches only mcft (docs/mcft/MOP-ON-OCL8.md §1.3).
    branches: [mcft, mcft8]
  pull_request:
    branches: [mcft]

jobs:
  ruby:
    name: Ruby parses, and parses on SketchUp 2021
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Any modern Ruby. The floor check is a SOURCE check, not an
          # execution one — see tools/check-ruby-floor.rb for why running under
          # the floor Ruby is neither available nor sufficient.
          ruby-version: '3.3'

      # Catches ordinary syntax errors. Cannot catch version-specific syntax,
      # which is the entire reason the next step exists. The loader is read
      # too: it sits outside ruby/ and a parse error there stops everything.
      - name: ruby -c every file we own
        run: |
          set -e
          n=0
          while IFS= read -r f; do
            ruby -c "$f" > /dev/null
            n=$((n+1))
          done < <(find src/ladb_opencutlist/ruby -name '*.rb' -not -path '*/ruby/lib/*'; echo src/ladb_opencutlist.rb; echo tools/mcft-autoupdate.rb)
          echo "ruby -c: $n files OK"

      - name: No syntax newer than the Ruby floor (SketchUp 2021 / Ruby 2.7)
        run: ruby tools/check-ruby-floor.rb

      # Neither check above can see a require pointing at a file the COMMIT
      # does not carry: both walk files that exist on disk, and the missing
      # file existed on disk — it was only absent from git. 2026-08-24 shipped
      # exactly that and every install raised LoadError, taking down the whole
      # of OpenCutList rather than just the MCFT tab.
      - name: Every require_relative points at a file git actually has
        run: ruby tools/check-requires.rb

      # `node --check` parses; it cannot know that dialog.stopProgress was
      # never written. On 2026-09-03 a batch feature shipped calling two
      # invented methods and the only thing that found them was Amit clicking
      # the button and getting a red TypeError. The dialog API is a small
      # closed set, so checking every call against it is cheap and exact —
      # this fork's substitute for the unit tests it does not have.
      - name: Every dialog.<method>() call names a method that exists
        run: ruby tools/check-dialog-api.rb

      # OpenCutList carries two thicknesses — the material's standard board
      # and the part's own geometry — and the CSV must send the first for
      # sheet goods. Sending the second put SG_PLY_V0_1mm on an estimate
      # (2026-09-09) from a part painted 16 mm ply but modelled 1 mm thick,
      # invisible in OCL's own table because it groups by the std thickness.
      # A source check, because the ruby job parses rather than executes.
      - name: The CSV sends the board thickness, not the drawn one
        run: ruby tools/check-csv-thickness.rb

      # The assembly qualifier has now been wrong three times, and each time it
      # was the REGEX and not the walk: ASMBL matched the parts inside an
      # assembly, a missing size token was promoted to Large, and MCFT_ was
      # used as a stand-in for "top level" that it could not be. The walk needs
      # a model; the regex needs nothing and is where every fault has been.
      #
      # On OpenCutList 8 it also covers GROUPS (a Smart Build module is one),
      # the unnamed-module list, the payload that sends no size map when
      # nothing was counted, and the walk's shape read from its source.
      - name: The assembly rule classifies names the way Amit stated it
        run: ruby tools/check-assembly-rule.rb

      # N2's default-part-name rule (Part, Part#3 — run, not read), and the
      # estimate stamp that says which build is loaded and settles IS_RBZ on
      # the Mac. A stamp is the first thing to vanish when a path moves.
      - name: The estimate's notes and its stamp
        run: ruby tools/check-estimate-notes.rb

      # Push to ERPNext is off until MRP is ready (Amit, 2026-09-25: "i do not
      # want to push any data from sketchup to erp as its not ready yet").
      # The commands were disabled rather than deleted — so the plugin says WHY
      # on screen, and so the estimate keeps the two class methods it borrows
      # from the push worker — which leaves the workers one line from being
      # called again. This is that line.
      - name: Pushing to ERPNext is still suspended
        run: ruby tools/check-push-suspended.rb

      # McftLog is the only MCFT file that runs outside SketchUp, so it is the
      # only one that can be tested rather than pattern-matched. It exists
      # because the Ruby Console loses everything on Clear and three diagnoses
      # this week needed a line that had already gone. The property under test
      # is that it never raises: a logger that throws takes down the estimate
      # it exists to explain.
      - name: The estimate log writes, truncates and never raises
        run: ruby tools/check-mcft-log.rb

      # OpenCutList 8 requires its controllers inside start(), which runs on
      # first dialog open, while setup() runs at LOAD and builds the menu
      # MOP's hunk names McftController in. check-requires passed on a tree
      # where that was a NameError that would stop the whole extension.
      - name: McftController is required before it is named, and started
        run: ruby tools/check-mcft-wiring.rb

      # One click on 8's Upgrade would replace MOP with stock OpenCutList
      # through the symlinks. 7.1 carried the same refusal and nothing checked
      # it (docs/mcft/MOP-ON-OCL8.md §6.3).
      - name: OpenCutList's own Upgrade is refused before anything downloads
        run: ruby tools/check-upgrade-refused.rb

      # The dialog's JS comes from the rbz and carries its own build; when the
      # Ruby's differs the dialog locks into upstream's "zzz" layout. And a
      # version ending in letters turns 8's IS_LAB on, which clears the
      # console line the startup update prints.
      - name: One upstream build everywhere, and a version that keeps IS_LAB off
        run: ruby tools/check-build-matches-rbz.rb

      # The startup updater is the last gate between a commit and Amit's
      # screen. Its decisions — what a --verify exit, a failed refresh, a CI
      # response or a foreign Plugins entry means — are run here.
      - name: The startup updater decides as designed
        run: ruby tools/check-autoupdate.rb

      # EVERY PATH THAT IS NOT MCFT'S IS THE UPSTREAM BUILD'S, BYTE FOR BYTE.
      # An upstream move on this line is `git merge -s ours` plus
      # tools/mcft-take-upstream.sh, never git's own three-way merge: git's
      # base here is a virtual one, and after a go-back commit it would be the
      # bad build, so a plain merge silently keeps that build's changes out.
      # This proves no such merge got in (docs/mcft/MOP-ON-OCL8.md §7.3, 6).
      - name: The tree is the upstream build in docs/mcft/UPSTREAM, plus MCFT
        run: ruby tools/check-upstream-tree.rb

  smoke:
    name: The dialog actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # THE ONLY CHECK HERE THAT RUNS THE CODE. Everything else in this
      # workflow reads it: ruby -c parses, check-dialog-api.rb matches names,
      # the bundle job rebuilds a file. None of them can see a method that
      # exists but is called wrongly, or a template that resolves but throws
      # while rendering.
      #
      # It loads EXACTLY what SketchUp loads on OpenCutList 8 — common-bundle.js
      # and js/i18n/en.js out of dist/ladb_opencutlist.rbz, and the COMMITTED
      # js/bundles/tabs-bundle.js — stubs only the SketchUp bridge, and clicks
      # through the MCFT actions. Nothing is compiled first: compiling would
      # test the sources, and the sources are not what reaches the screen.
      # Proved by reintroducing the TypeError of 2026-09-03 into the bundle: it
      # exits 1. A test that has only ever passed proves nothing.
      - name: Headless dialog smoke test
        run: |
          cd build
          npm ci --no-audit --no-fund --silent
          cd ..
          NODE_PATH=build/node_modules node test/smoke/dialog-smoke.js

  bundle:
    name: Committed dialog bundle matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # js/bundles/tabs-bundle.js is a BUILD OUTPUT this branch tracks on
      # purpose: on OpenCutList 8 the tabs dialog loads it instead of the tab
      # plugins and templates, and the rbz's copy is stock 8's, so git is the
      # only route by which an MCFT JS or twig change reaches SketchUp
      # (.gitignore, and docs/mcft/MOP-ON-OCL8.md §6.1). Tracking a generated
      # file invites exactly one bug: a source edited and committed without
      # its output — the failure of 2026-09-03, which made a feature that could
      # not appear.
      #
      # Built by TWO invocations, never `gulp bundle`: that also runs
      # css_bundle, whose css/lib/*.min.css inputs are gitignored, so it fails
      # on a clean checkout; and twig_compile returns before its async del()
      # settles, so chaining it in one series can race. `npm ci` against the
      # committed lockfile, so the tree is the same on every machine.
      #
      # Compared SORTED, and that is not leniency. The twig templates inside
      # the bundle are concatenated in a glob's filesystem order, so the same
      # sources built on two machines give the same lines in a different order.
      # Content still has to match exactly: edit a source without rebuilding
      # and a line's text changes, which no reordering can hide.
      - name: Rebuild and compare
        run: |
          f=src/ladb_opencutlist/js/bundles/tabs-bundle.js
          sort "$f" > /tmp/committed.txt
          cd build
          npm ci --no-audit --no-fund --silent
          npx gulp twig_compile
          npx gulp js_bundle_tabs
          cd ..
          sort "$f" > /tmp/rebuilt.txt
          if ! diff -q /tmp/committed.txt /tmp/rebuilt.txt > /dev/null; then
            echo "::error::$f is stale — run 'cd build && npm ci && npx gulp twig_compile' then 'npx gulp js_bundle_tabs', and commit the bundle"
            diff /tmp/committed.txt /tmp/rebuilt.txt | head -20
            exit 1
          fi
          echo "committed bundle matches its sources ($(wc -l < "$f") lines, $(grep -c '^Twig.twig({' "$f") templates)"

      # A later merge that runs a directory-level `git add` would drop the
      # bundle with no error if an ignore rule ever covered it again — which is
      # exactly what 8's own `/js/bundles/` line does. Asserted both ways, for
      # both files this branch tracks against upstream's ignores.
      - name: The bundle and the lockfile are tracked, and not ignored
        run: |
          for f in src/ladb_opencutlist/js/bundles/tabs-bundle.js build/package-lock.json; do
            if git check-ignore -q --no-index "$f"; then
              echo "::error::$f is matched by an ignore rule — see .gitignore (a ! line cannot re-include a file under an ignored directory)"
              exit 1
            fi
            git ls-files --error-unmatch "$f" > /dev/null
          done
          echo "tabs-bundle.js and build/package-lock.json are tracked and not ignored"

  refresh:
    name: The build-output refresh does what every start trusts it to
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools/mcft-refresh-outputs.sh lays every build output down from
      # dist/ladb_opencutlist.rbz at install and at every SketchUp start after
      # a new rbz arrives, and its --verify is what stops the updater saying
      # "up to date" on a clone that no longer holds MOP. RUN here against a
      # throwaway copy of this commit, with the same cp command the Mac runs:
      # stale outputs replaced, tracked files untouched, nothing left
      # untracked, a build mismatch refused before src/ is touched, and each
      # --verify exit code (docs/mcft/MOP-ON-OCL8.md §7.3 check 5).
      - name: Refresh, --if-stale and --verify, run
        run: bash tools/check-refresh-outputs.sh
