# MCFT branch checks. Upstream OpenCutList ships no Ruby CI; this is ours and
# is deliberately small — the plugin has no test bench, so the one thing worth
# automating is the failure that takes the WHOLE extension down: a file that
# SketchUp's Ruby cannot parse.
name: MCFT checks

on:
  push:
    branches: [mcft]
  pull_request:
    branches: [mcft]

jobs:
  ruby:
    name: Ruby parses, and parses on SketchUp 2017
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Any modern Ruby. The 2.2 compatibility check is a source check,
          # not an execution one — see tools/check-ruby22.rb for why running
          # under a real 2.2 is neither available nor sufficient.
          ruby-version: '3.3'

      # Catches ordinary syntax errors. Cannot catch version-specific syntax,
      # which is the entire reason the next step exists.
      - name: ruby -c every file we own
        run: |
          set -e
          n=0
          while IFS= read -r f; do
            ruby -c "$f" > /dev/null
            n=$((n+1))
          done < <(find src/ladb_opencutlist/ruby -name '*.rb' -not -path '*/ruby/lib/*')
          echo "ruby -c: $n files OK"

      - name: No syntax newer than SketchUp 2017's Ruby 2.2.4
        run: ruby tools/check-ruby22.rb

  templates:
    name: Committed twig bundle matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # js/templates/tabs-twig-templates.js is a BUILD OUTPUT that this branch
      # tracks on purpose (see .gitignore for why git is the only delivery
      # route). Tracking a generated file invites exactly one bug: someone
      # edits a .twig, forgets to run gulp, and ships a bundle that does not
      # contain the change — the plugin then looks stale for no visible
      # reason, which is the failure this repo has already paid for once.
      - name: Recompile and diff
        run: |
          cd build
          npm install --no-audit --no-fund --silent
          npx gulp compile
          cd ..
          if ! git diff --quiet -- src/ladb_opencutlist/js/templates/tabs-twig-templates.js; then
            echo "::error::tabs-twig-templates.js is stale — run 'cd build && npx gulp compile' and commit the result"
            git diff --stat -- src/ladb_opencutlist/js/templates/tabs-twig-templates.js
            exit 1
          fi
          echo "committed bundle matches the twig it came from"
